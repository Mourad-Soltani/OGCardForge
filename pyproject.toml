[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ogcardforge"
version = "1.0.0"
description = "Generate beautiful Open Graph social cards offline. Built by Mourad.Soltani"
authors = [{name = "Mourad.Soltani"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow>=10.0.0"]

[project.scripts]
ogcardforge = "ogcardforge:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ogcardforge*"]
